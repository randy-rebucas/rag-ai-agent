# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "27a159bea3c7cc7217e2e2c169e2dfed"
application_url = "https://example.com"
embedded = true
name = "rag-ai-agent"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions,read_orders,read_customers,read_inventory,read_locations,read_discounts,read_fulfillments,read_content"

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

[metaobjects.app.example.fields.title]
name = "Title"
type = "single_line_text_field"
required = true

[metaobjects.app.example.fields.description]
name = "Description"
type = "multi_line_text_field"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/upsert"
  topics = [ "products/create", "products/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/products/delete"
  topics = [ "products/delete" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/inventory_levels/update"
  topics = [ "inventory_levels/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/collections/update"
  topics = [ "collections/create", "collections/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/discounts/upsert"
  topics = [ "discounts/create", "discounts/update" ]

  # fulfillments/create and fulfillments/update carry shipping/tracking data,
  # which Shopify classifies as protected customer data — subscribing requires
  # approval (https://shopify.dev/docs/apps/launch/protected-customer-data).
  # Route + normalize code already exist (webhooks.fulfillments.upsert.tsx);
  # uncomment this once the app is approved for that data tier.
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/fulfillments/upsert"
  # topics = [ "fulfillments/create", "fulfillments/update" ]

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
